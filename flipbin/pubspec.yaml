version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.0
  drift: ^2.14.0
  go_router: ^13.0.0
  mobile_scanner: ^7.4.2
  dio: ^5.4.0
  googleapis: ^12.0.0
  google_sign_in: ^6.2.0
  intl: ^0.19.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
