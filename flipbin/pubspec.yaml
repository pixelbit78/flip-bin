  extension_google_sign_in_as_googleapis_auth: ^2.0.13
  http: ^1.6.0
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.5
  web: ^1.1.1

dev_dependencies:
  drift_dev: ^2.14.0
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.0
  mocktail: ^1.0.0
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
